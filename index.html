<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale / user-scalable=no: iOS has ignored them since iOS 10, so
     they never stopped the focus zoom they get added for — they only block
     pinch-zoom for low-vision users on other browsers. Fields are 16px on
     touch instead, which is what actually prevents iOS zooming into them. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Quest — Learn Fractions (P3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f2f7f4;
    --card: #ffffff;
    --ink: #243932;
    --muted: #63796f;
    --line: #dde9e2;
    --green: #2fa56a;
    --green-soft: #e2f4ea;
    --green-deep: #1d7f4f;
    --amber: #f2a63c;
    --amber-soft: #fdf1dd;
    --red: #d95d5d;
    --red-soft: #fbe9e9;
    --blue: #3f7fd1;
    --blue-soft: #e7f0fb;
    --purple: #8a63c9;
    --purple-soft: #f0eafa;
    --shade: #58c185;
    --shade-2: #f2b04c;
    --radius: 18px;
    --shadow: 0 6px 18px rgba(36,57,50,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  h1,h2,h3,h4{ font-family:'Baloo 2','Nunito',sans-serif; line-height:1.25; margin:0; }

  /* ---------- header ---------- */
  header{
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px;
  }
  .header-inner{
    max-width: 860px; margin: 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .logo{ font-size:2rem; }
  .brand h1{ font-size:1.5rem; color:var(--green-deep); }
  .brand .sub{ font-size:0.85rem; color:var(--muted); margin-top:2px; }
  .polymath-logo{ height:48px; width:auto; max-width:190px; display:block; }
  /* shown only if the logo image can't load (offline) */
  .polymath-wordmark{
    display:none; font-family:'Baloo 2','Nunito',sans-serif; font-weight:800;
    font-size:1.05rem; line-height:1.15; color:var(--green-deep);
  }
  .polymath-wordmark small{ display:block; font-size:0.72rem; font-weight:600; color:var(--muted); }
  .brand-sep{ width:1px; height:36px; background:var(--line); flex:none; }
  .star-pill{
    background: var(--amber-soft); border:1.5px solid #f3ddb5; color:#9a6a17;
    font-weight:800; padding: 8px 18px; border-radius:999px; font-size:1rem;
    display:flex; align-items:center; gap:8px;
  }

  /* ---------- tabs ---------- */
  nav.tabs{
    max-width:860px; margin: 20px auto 0; padding: 0 20px;
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .tab-btn{
    border:1.5px solid var(--line); background:var(--card); color:var(--muted);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    padding: 10px 22px; border-radius: 999px; cursor:pointer; transition: all .15s;
  }
  .tab-btn:hover{ border-color:var(--green); color:var(--green-deep); }
  .tab-btn.active{ background:var(--green); border-color:var(--green); color:#fff; }

  main{ max-width:860px; margin: 0 auto; padding: 24px 20px 90px; }

  /* ---------- cards ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow: var(--shadow); padding: 28px; margin: 0 auto 22px; max-width: 720px;
  }
  .card h2{ font-size:1.35rem; color:var(--green-deep); margin-bottom: 6px; }
  .card h3{ font-size:1.1rem; margin-bottom:4px; }
  .card .lede{ color:var(--muted); font-size:0.95rem; margin: 0 0 18px; }

  .idea{
    background:var(--blue-soft); border:1.5px solid #cfe1f6; border-radius:14px;
    padding: 16px 20px; margin: 18px 0; font-size:0.97rem;
  }
  .idea b{ color:var(--blue); }
  .warn{
    background:var(--red-soft); border:1.5px solid #f0cccc; border-radius:14px;
    padding: 16px 20px; margin: 18px 0; font-size:0.97rem;
  }
  .warn b{ color:var(--red); }

  /* ---------- fraction display ---------- */
  .frac{
    display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    margin: 0 6px; line-height:1.15; font-weight:800; font-size:1.25rem;
  }
  .frac .fd{ border-top: 2.5px solid var(--ink); padding-top:2px; }
  .frac .fn, .frac .fd{ padding-left:8px; padding-right:8px; min-width: 30px; text-align:center; }
  .eq-row{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    font-size:1.3rem; font-weight:800; margin: 18px 0; text-align:center;
  }
  .eq-row .op{ font-size:1.4rem; color:var(--muted); }

  .blank{
    width: 58px; height: 44px; text-align:center; font-family:'Nunito',sans-serif;
    font-size:1.2rem; font-weight:800; color:var(--ink);
    border: 2px dashed #b8cdc1; border-radius: 10px; background:#fbfdfc; outline:none;
    -moz-appearance: textfield;
  }
  .blank::-webkit-outer-spin-button,.blank::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .blank:focus{ border-color: var(--green); border-style: solid; background:#fff; }
  .blank.ok{ border-color:var(--green); border-style:solid; background:var(--green-soft); }
  .blank.bad{ border-color:var(--red); border-style:solid; background:var(--red-soft); }

  /* ---------- bars ---------- */
  .bar-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; margin: 18px 0; }
  .bar-label{ font-size:0.9rem; color:var(--muted); font-weight:700; }
  svg.fbar{ max-width:100%; height:auto; display:block; }
  /* the cut: dotted while it travels down, solid once the piece is cut */
  .split-line{
    stroke:#243932; stroke-width:1.4; stroke-dasharray:4 4; opacity:.55;
    transition: stroke-width .25s ease, opacity .25s ease;
  }
  .fbar-split.cut .split-line{ stroke-dasharray:none; stroke-width:1.8; opacity:1; }
  /* content that waits for the cut to finish before sliding in */
  .reveal-later{ display:none; }
  .reveal-later.shown{ display:block; animation: fadeUp .4s ease both; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .reveal-later.shown{ animation:none; }
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    border:none; border-radius:12px; padding: 12px 26px; cursor:pointer; transition: all .15s;
  }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-green{ background:var(--green); color:#fff; }
  .btn-green:hover:not(:disabled){ background:var(--green-deep); }
  .btn-soft{ background:var(--green-soft); color:var(--green-deep); border:1.5px solid #bfe3cf; }
  .btn-soft:hover:not(:disabled){ background:#d3eede; }
  .btn-blue{ background:var(--blue); color:#fff; }
  .btn-blue:hover:not(:disabled){ background:#3268ae; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1.5px solid var(--line); }
  .btn-ghost:hover{ color:var(--ink); border-color:#c3d4ca; }
  .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top: 20px; }

  .chip-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin: 14px 0; }
  .chip{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.95rem;
    padding: 8px 18px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer; transition: all .15s;
  }
  .chip:hover:not(:disabled){ border-color:var(--green); color:var(--green-deep); }
  .chip.active{ background:var(--green); border-color:var(--green); color:#fff; }
  .chip:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---------- feedback ---------- */
  .feedback{ border-radius:14px; padding: 16px 20px; margin-top: 18px; font-size:0.97rem; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--green-soft); border:1.5px solid #bfe3cf; }
  .feedback.bad{ background:var(--red-soft); border:1.5px solid #f0cccc; }
  .feedback.info{ background:var(--blue-soft); border:1.5px solid #cfe1f6; }
  .feedback .fb-title{ font-weight:800; margin-bottom:4px; }

  /* ---------- pickers / grids ---------- */
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:16px; }
  .pick-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:16px;
    padding: 22px 20px; cursor:pointer; transition: all .15s; box-shadow:var(--shadow);
  }
  .pick-card:hover{ border-color:var(--green); transform: translateY(-2px); }
  .pick-card .pc-emoji{ font-size:1.8rem; }
  .pick-card h3{ margin: 10px 0 4px; font-size:1.05rem; }
  .pick-card p{ margin:0 0 10px; color:var(--muted); font-size:0.88rem; line-height:1.5; }
  .pick-card .pc-meta{ font-size:0.85rem; color:#9a6a17; font-weight:800; }
  .pick-card.done{ border-color:#bfe3cf; background:var(--green-soft); }

  .lesson-steps{ display:flex; gap:8px; justify-content:center; margin-bottom: 20px; flex-wrap:wrap; }
  .lstep{
    width:34px; height:34px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:0.9rem;
    color:var(--muted); background:var(--card); cursor:pointer;
  }
  .lstep.active{ border-color:var(--green); background:var(--green); color:#fff; }
  .lstep.done{ border-color:var(--green); color:var(--green-deep); background:var(--green-soft); }

  .ai-box{ background:var(--purple-soft); border:1.5px solid #ddd0f2; border-radius:14px; padding:16px 20px; margin-top:18px; font-size:0.96rem; }
  .ai-box .ai-title{ font-weight:800; color:var(--purple); margin-bottom:4px; }
  .ai-stars{ font-size:1.5rem; letter-spacing:4px; margin: 6px 0; }

  textarea.explain-input{
    width:100%; min-height:130px; border:2px dashed #b8cdc1; border-radius:12px;
    padding: 14px 16px; font-family:'Nunito',sans-serif; font-size:1rem; line-height:1.6;
    resize:vertical; outline:none; background:#fbfdfc;
  }
  textarea.explain-input:focus{ border-color:var(--green); border-style:solid; background:#fff; }

  .spinner{
    display:inline-block; width:18px; height:18px; border:3px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; vertical-align:-3px; margin-right:8px;
  }
  .spinner.dark{ border-color:#d8cff0; border-top-color:var(--purple); }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding: 12px 24px; border-radius:12px;
    font-weight:700; opacity:0; pointer-events:none; transition: all .25s; z-index:60; max-width:90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #versionBadge{
    position:fixed; right:14px; bottom:12px; font-size:0.72rem; color:#9ab3a6;
    background:rgba(255,255,255,.8); border:1px solid var(--line); border-radius:999px;
    padding: 3px 10px; z-index:50;
  }

  /* ---------- example gallery ---------- */
  .ex-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin: 18px 0; }
  .ex-card{
    border:1.5px solid var(--line); border-radius:16px; padding: 14px 14px 16px;
    background:#fbfdfc; text-align:center;
  }
  .ex-card .ex-fig{ display:flex; justify-content:center; align-items:center; min-height:76px; }
  .ex-card .ex-fig .bar-wrap{ margin: 6px 0; gap:6px; }
  .ex-card .ex-txt{ font-size:0.88rem; color:var(--muted); line-height:1.45; margin: 8px 0 6px; }
  .ex-card .ex-ans{ font-weight:800; font-size:0.95rem; color:var(--green-deep); }
  .ex-card .ex-ans .frac{ font-size:1.05rem; }
  .ex-tag{
    display:inline-block; font-size:0.72rem; font-weight:800; letter-spacing:.04em;
    text-transform:uppercase; padding: 2px 10px; border-radius:999px; margin-bottom:6px;
  }
  .ex-tag.whole{ background:var(--green-soft); color:var(--green-deep); }
  .ex-tag.group{ background:var(--blue-soft); color:var(--blue); }
  .ex-tag.number{ background:var(--purple-soft); color:var(--purple); }

  /* ---------- emoji sets / equal groups ---------- */
  .eset{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin: 8px 0; }
  .eitem{ padding: 2px 4px; border-radius:8px; line-height:1.2; }
  .eitem.on{ background:var(--green-soft); box-shadow: inset 0 0 0 2px #bfe3cf; }
  .eitem.dim{ opacity:.4; filter:grayscale(1); }
  .gset{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin: 18px 0; }
  .gbox{
    border:2px dashed #b8cdc1; border-radius:14px; padding: 8px 10px; background:#fbfdfc;
    display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:160px;
  }
  .gbox.on{ border-style:solid; border-color:var(--green); background:var(--green-soft); }
  .gbox span{ font-size:1.3rem; line-height:1.2; }

  /* ---------- exam ---------- */
  .exam-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .exam-tag{ font-size:0.85rem; font-weight:800; color:var(--muted); margin-top:3px; }
  .exam-dots{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .edot{
    width:34px; height:34px; border-radius:10px; border:1.5px solid var(--line); background:var(--card);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.85rem; color:var(--muted);
    cursor:pointer; flex:0 0 auto;
  }
  .edot.done{ border-color:#bfe3cf; background:var(--green-soft); color:var(--green-deep); }
  .edot.active{ background:var(--green); border-color:var(--green); color:#fff; }
  /* Finish / Next stay reachable without scrolling to the end of a long
     question — solid, so nothing ghosts through from underneath. */
  .exam-nav{
    position:sticky; bottom:0; margin-top:20px; padding:12px 0 6px;
    background:var(--card); box-shadow: 0 -10px 14px -10px rgba(36,57,50,0.22);
  }
  /* While a number is being typed, the on-screen keyboard has already taken
     the bottom of the screen — a bar stuck above it would cover the answer
     box itself, so it goes back to the end of the card. */
  body.typing .exam-nav{ position:static; box-shadow:none; }

  /* ---------- working area ---------- */
  .work{ margin: 20px 0 4px; }
  .work-toggle{ width:100%; }
  .work-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin: 12px 0 8px; }
  .work-tool{
    width:44px; height:44px; border-radius:12px; flex:0 0 auto;
    border:1.5px solid var(--line); background:var(--card); font-size:1.15rem; cursor:pointer;
  }
  .work-tool.active{ background:var(--green-soft); border-color:#bfe3cf; }
  .work-hint{ font-size:0.8rem; color:var(--muted); font-weight:700; }
  .work-pad-wrap{ border:2px dashed #b8cdc1; border-radius:14px; background:#fbfdfc; overflow:hidden; }
  canvas.work-pad{
    display:block; width:100%; aspect-ratio: 3 / 2;
    max-height: calc(var(--vvh, 100vh) * 0.5);
    /* the pad owns the gesture, so a stroke never scrolls the page… */
    touch-action:none; overscroll-behavior:none;
  }
  /* …until an Apple Pencil shows up, after which fingers scroll and only the pencil writes */
  canvas.work-pad.stylus{ touch-action: pan-y; }

  /* ---------- exam results ---------- */
  .res-score{ font-family:'Baloo 2',sans-serif; font-size:2.8rem; font-weight:800; color:var(--green-deep); line-height:1.1; }
  .res-item{ border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; background:#fbfdfc; }
  .res-item.ok{ border-color:#bfe3cf; background:var(--green-soft); }
  .res-item.bad{ border-color:#f0cccc; background:var(--red-soft); }
  .res-head{ font-weight:800; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .res-q{ font-size:0.92rem; margin:6px 0; color:var(--ink); }
  .res-ans{ font-size:0.9rem; color:var(--muted); font-weight:700; }
  .res-ans b{ color:var(--ink); }
  .res-work{ margin-top:10px; }
  .res-work img{ width:100%; max-width:340px; display:block; border:1px solid var(--line); border-radius:10px; background:#fff; }

  /* ---------- touch devices: no sticky :hover, real press feedback ----------
     iOS/iPadOS latches :hover onto whatever was tapped and holds it until
     something else is tapped, so the last chip pressed kept looking chosen
     next to the genuinely active one. Neutralise hover where the device
     cannot hover, and give a pressed state in its place. */
  @media (hover: none){
    .tab-btn:hover{ border-color:var(--line); color:var(--muted); }
    .tab-btn.active:hover{ border-color:var(--green); color:#fff; }
    .chip:hover:not(:disabled){ border-color:var(--line); color:var(--muted); }
    .chip.active:hover{ border-color:var(--green); color:#fff; }
    .pick-card:hover{ border-color:var(--line); transform:none; }
    .btn-green:hover:not(:disabled){ background:var(--green); }
    .btn-blue:hover:not(:disabled){ background:var(--blue); }
    .btn-soft:hover:not(:disabled){ background:var(--green-soft); }
    .btn-ghost:hover{ color:var(--muted); border-color:var(--line); }

    .btn:active:not(:disabled){ transform: translateY(1px); filter: brightness(0.96); }
    .chip:active:not(:disabled), .tab-btn:active{ background:#eef5f0; }
    .chip.active:active{ background:var(--green-deep); }
    .pick-card:active, .edot:active, .work-tool:active, .lstep:active{ background:#eef5f0; }
  }

  /* ---------- touch ergonomics ----------
     Apple's minimum comfortable target is 44px, and anything under 16px in a
     field makes iOS zoom the whole page on focus and never zoom back. */
  @media (pointer: coarse){
    .btn{ min-height:44px; }
    .tab-btn, .chip{ min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
    .lstep{ width:42px; height:42px; font-size:1rem; }
    .edot{ width:42px; height:42px; font-size:0.95rem; }
    .blank{ min-height:44px; font-size:16px; }
    textarea.explain-input{ font-size:16px; }
    .eitem{ padding:4px 6px; }
  }

  /* No grey iOS tap flash, and no text selection or magnifier callout when a
     hand rests on the chrome. Content itself stays selectable. */
  .btn, .chip, .tab-btn, .pick-card, .lstep, .edot, .work-tool{ -webkit-tap-highlight-color: transparent; }
  header, nav.tabs, .lesson-steps, .exam-dots, .work-bar, .chip-row{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  /* Flicking a card's contents past its end used to chain into the page behind. */
  .card, .ex-grid{ overscroll-behavior: contain; }

  @media (max-width:560px){
    .brand{ gap:9px; }
    .polymath-logo{ height:36px; max-width:130px; }
    .brand-sep{ height:28px; }
    .brand h1{ font-size:1.25rem; }
    .brand .sub{ display:none; }
    .card{ padding: 22px 18px; }
    .eq-row{ font-size:1.15rem; }
    .blank{ width:50px; height:40px; font-size:1.05rem; }
    .ex-grid{ grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img class="polymath-logo"
           src="https://dl.dropboxusercontent.com/scl/fi/h40yjlyg8ldefwfaa3dib/polymath-logo-sticker.png?rlkey=o1ra4taqy79gt9t8u096v82zj"
           alt="Polymath Learning Centre"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="polymath-wordmark">Polymath<small>Learning Centre</small></span>
      <span class="brand-sep"></span>
      <div class="logo">🍰</div>
      <div>
        <h1>Fraction Quest</h1>
        <div class="sub">Really understand fractions — Primary 3</div>
      </div>
    </div>
    <div class="star-pill">⭐ <span id="starCount">0</span> stars</div>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="learn" onclick="goTab('learn')">📖 Learn</button>
  <button class="tab-btn" data-tab="practice" onclick="goTab('practice')">✏️ Practice</button>
  <button class="tab-btn" data-tab="exam" onclick="goTab('exam')">📝 Exam</button>
  <button class="tab-btn" data-tab="explain" onclick="goTab('explain')">🤖 Teach the AI</button>
</nav>

<main id="view"></main>

<div id="toast"></div>
<div id="versionBadge"></div>

<script type="module">
// =====================================================================
// Firebase AI Logic (same shared "mathgen--app" project as math.html).
// Only the AI is used here — progress lives in localStorage.
// Loaded dynamically so the app still boots (lessons + practice work
// offline) even if the Firebase CDN can't be reached; only the AI
// features need it.
// =====================================================================
const APP_VERSION = 'v1.5.0';

const firebaseConfig = {
  apiKey: "AIzaSyAUSI3Uh28IeqASEp0JhH4QPaVt-O3meBo",

// =====================================================================
// Fraction bar SVG
//   num/den shaded; split k draws dashed sub-lines cutting every piece
//   into k; glue g draws bold lines only every g pieces (grouping).
// =====================================================================
function fbar(num, den, opts = {}) {
  const { split = 1, glue = 1, w = 360, h = 58, color = 'var(--shade)', label = null, round = 10, animateSplit = true } = opts;
  const r = round, sw = 2;
  const uid = fbar._id = (fbar._id || 0) + 1;
  let cells = '';
  const pieceW = w / den;
  for (let i = 0; i < num; i++) {
    cells += `<rect x="${(i * pieceW).toFixed(2)}" y="0" width="${pieceW.toFixed(2)}" height="${h}" fill="${color}"/>`;
  }
  // piece boundaries
  let lines = '';
  for (let i = 1; i < den; i++) {
    const x = (i * pieceW).toFixed(2);
    const strong = (glue > 1) ? (i % glue === 0) : true;
    lines += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#243932" stroke-width="${strong ? sw : 1}" ${strong ? '' : 'stroke-dasharray="3 4" opacity="0.35"'}/>`;
  }
  // sub-splits: the dotted cut. Drawn in their own group so the cut can be
  // revealed downwards and then turned solid — see revealSplits().
  let splitSvg = '';
  if (split > 1) {
    const subW = pieceW / split;
    let sl = '';
    for (let i = 0; i < den; i++) {
      for (let j = 1; j < split; j++) {
        const x = (i * pieceW + j * subW).toFixed(2);
        sl += `<line class="split-line" x1="${x}" y1="0" x2="${x}" y2="${h}"/>`;
      }
    }
    splitSvg = animateSplit
      ? `<clipPath id="rv${uid}"><rect data-reveal="rv${uid}" x="-2" y="-2" width="${w + 4}" height="0"/></clipPath>
         <g class="fbar-split" data-pending="1" data-clip="rv${uid}" data-full="${h + 4}" clip-path="url(#rv${uid})">${sl}</g>`
      : `<g class="fbar-split">${sl}</g>`;
  }
  const lbl = label ? `<div class="bar-label">${label}</div>` : '';
  return `<div class="bar-wrap"><svg class="fbar" viewBox="-2 -2 ${w + 4} ${h + 4}" width="${w}" role="img" aria-label="${num} out of ${den} pieces shaded">
    <clipPath id="c${uid}"><rect x="0" y="0" width="${w}" height="${h}" rx="${r}"/></clipPath>
    <rect x="0" y="0" width="${w}" height="${h}" rx="${r}" fill="#eef5f0"/>
    <g clip-path="url(#c${uid})">${cells}${lines}${splitSvg}</g>
    <rect x="0" y="0" width="${w}" height="${h}" rx="${r}" fill="none" stroke="#243932" stroke-width="${sw + 0.5}"/>
  </svg>${lbl}</div>`;
}

// =====================================================================
// The cut animation
//   A dotted line travels down the bar (the clip window grows downward,
//   so nothing moves and nothing re-renders), and when it reaches the
//   bottom the dots become solid lines — the piece has been cut.
// =====================================================================
const SPLIT_REVEAL_MS = 700;
const noMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function revealSplits(root){
  (root || document).querySelectorAll('g.fbar-split[data-pending]').forEach(g => {
    delete g.dataset.pending;
    const rect = g.closest('svg')?.querySelector(`[data-reveal="${g.dataset.clip}"]`);
    const full = parseFloat(g.dataset.full) || 0;
    if (!rect || noMotion()) { if (rect) rect.setAttribute('height', full); g.classList.add('cut'); return; }
    const t0 = performance.now();
    const step = (now) => {
      const p = Math.min(1, (now - t0) / SPLIT_REVEAL_MS);
      rect.setAttribute('height', (full * (1 - Math.pow(1 - p, 3))).toFixed(2));  // ease-out
      if (p < 1) requestAnimationFrame(step);
      else g.classList.add('cut');   // dots become real cuts
    };
    requestAnimationFrame(step);
  });
}
// Round "pizza / pie / cake" version of the same idea: den equal sectors, num shaded.
function pie(num, den, opts = {}) {
  const { size = 118, color = 'var(--shade)', label = null } = opts;
  const c = size / 2, r = c - 3;
  const step = (Math.PI * 2) / den;
  const pt = (a) => [(c + r * Math.cos(a)).toFixed(2), (c + r * Math.sin(a)).toFixed(2)];
  let sectors = '', lines = '';
  if (num >= den) {
    sectors = `<circle cx="${c}" cy="${c}" r="${r}" fill="${color}"/>`;
  } else {
    for (let i = 0; i < num; i++) {
      const a0 = -Math.PI / 2 + i * step, a1 = a0 + step;
      const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
      sectors += `<path d="M ${c} ${c} L ${x0} ${y0} A ${r} ${r} 0 ${step > Math.PI ? 1 : 0} 1 ${x1} ${y1} Z" fill="${color}"/>`;
    }
  }
  if (den > 1) {
    for (let i = 0; i < den; i++) {
      const [x, y] = pt(-Math.PI / 2 + i * step);
      lines += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#243932" stroke-width="1.6"/>`;
    }
  }
  const lbl = label ? `<div class="bar-label">${label}</div>` : '';
  return `<div class="bar-wrap"><svg class="fbar" viewBox="-2 -2 ${size + 4} ${size + 4}" width="${size}" role="img" aria-label="${num} out of ${den} equal slices shaded">
    <circle cx="${c}" cy="${c}" r="${r}" fill="#eef5f0"/>
    ${sectors}${lines}
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#243932" stroke-width="2.5"/>
  </svg>${lbl}</div>`;
}
// A group of things: the first `num` items are the chosen ones.
function emojiSet(total, num, on, off = null, opts = {}) {
  const { size = '1.5rem', label = null } = opts;
  let out = '';
  for (let i = 0; i < total; i++) {
    const isOn = i < num;
    const cls = isOn ? 'on' : (off ? '' : 'dim');
    out += `<span class="eitem ${cls}" style="font-size:${size}">${isOn ? on : (off || on)}</span>`;
  }
  const lbl = label ? `<div class="bar-label">${label}</div>` : '';
  return `<div class="bar-wrap" style="gap:6px;"><div class="eset" role="img" aria-label="${num} out of ${total} chosen">${out}</div>${lbl}</div>`;
}
// A number shared into `den` equal groups; the first `num` groups are taken.
function groupSet(total, den, num, emoji, opts = {}) {
  const { label = null } = opts;
  const per = total / den;
  let boxes = '';
  for (let g = 0; g < den; g++) {
    boxes += `<div class="gbox ${g < num ? 'on' : ''}">${`<span>${emoji}</span>`.repeat(per)}</div>`;
  }
  const lbl = label ? `<div class="bar-label">${label}</div>` : '';
  return `<div class="bar-wrap" style="gap:6px;"><div class="gset" role="img" aria-label="${total} shared into ${den} equal groups, ${num} groups taken">${boxes}</div>${lbl}</div>`;
}
function frac(n, d){ return `<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`; }
function blank(id, w){ return `<input class="blank" id="${id}" inputmode="numeric" autocomplete="off" ${w ? `style="width:${w}px"` : ''}>`; }
function fracBlank(idN, idD){ return `<span class="frac"><span class="fn">${blank(idN)}</span><span class="fd" style="padding-top:6px;">${blank(idD)}</span></span>`; }
function getNum(id){
  const v = ($(id)?.value ?? '').trim();

}

// Lesson 2 — The Magic Split (equivalent fractions, why × works)

const l2 = { n: 1, d: 2, k: 1 };
function renderL2(L){
  const steps = [0,1,2,3];
  let body = '';
  if (lessonState.step === 0) {
    const { n, d, k } = l2;
    body = `
      <h3>Split every piece — the amount doesn't change!</h3>
      <p>Here is ${frac(n, d)} of a bar. Now cut <b>every</b> piece into smaller equal pieces. Does the shaded amount grow or shrink?</p>
      <div id="l2bar">${fbar(n, d, { split: k, label: l2Label() })}</div>
      <div class="chip-row" id="l2chips"><span style="align-self:center; font-weight:700; color:var(--muted);">Cut every piece into:</span>
        ${[1,2,3,4].map(kk => `<button class="chip ${kk === l2.k ? 'active' : ''}" data-k="${kk}" onclick="l2SetK(${kk})">${kk === 1 ? 'no cut' : '×' + kk}</button>`).join('')}
      </div>
      <div class="eq-row" id="l2eq">${l2EqHtml()}</div>
      <div class="idea" id="l2idea">${l2IdeaHtml()}</div>
      <div class="chip-row"><span style="align-self:center; font-weight:700; color:var(--muted);">Try another fraction:</span>
        ${[[1,2],[2,3],[3,4]].map(([nn,dd]) => `<button class="chip ${nn === l2.n && dd === l2.d ? 'active' : ''}" onclick="l2SetFrac(${nn},${dd})">${nn}/${dd}</button>`).join('')}
      </div>
      ${nextBtn()}`;
  } else if (lessonState.step === 1) {
    body = `
      <h3>Why must we multiply BOTH numbers?</h3>
      <p>The top and bottom are a team. When you cut every piece into 3, you get 3 times as many <b>shaded</b> pieces (top ×3) and 3 times as many <b>total</b> pieces (bottom ×3). One can't change without the other!</p>
      ${fbar(1, 2, { label: '1/2' })}
      ${fbar(3, 6, { glue: 3, label: '1/2 = 3/6 — same amount, smaller pieces, new name' })}
      <div class="idea"><b>Multiplying top and bottom by the same number</b> is really just <b>cutting the same picture into smaller pieces</b>. Nothing is added, nothing is taken away.</div>
      ${nextBtn()}`;
  } else if (lessonState.step === 2) {
    body = `
      <h3>⚠️ What about ADDING the same number?</h3>
      <p>Sam says: "If multiplying both numbers is OK, adding 1 to both should be OK too! So ${frac(1,2)} = ${frac(2,3)}." Let's check with a picture:</p>
      ${fbar(1, 2, { label: '1/2' })}
      ${fbar(2, 3, { color: 'var(--shade-2)', label: '2/3 — more is shaded!' })}
      <div class="warn"><b>Sam is wrong!</b> ${frac(2,3)} is clearly MORE than ${frac(1,2)}. Adding the same number to top and bottom is <b>not</b> a fair move — it changes the amount. Only <b>multiplying (or dividing)</b> both by the same number keeps the fraction equal, because that's just re-cutting the same picture.</div>
      ${nextBtn()}`;
  } else {
    body = quickCheckHtml({
      html: `
        <h3>Quick check</h3>
        <p>Every piece of this ${frac(2,3)} bar is cut into 2. Fill in the blanks:</p>
        ${fbar(2, 3, { split: 2 })}
        <div class="eq-row">${frac(2,3)}<span class="op">=</span>${frac(`2 × 2`, `3 × 2`)}<span class="op">=</span>${fracBlank('qc2n','qc2d')}</div>`,
      answers: { qc2n: 4, qc2d: 6 },
      feedbackGood: '2/3 = 4/6 — same amount, just cut smaller!',
      feedbackBad: 'Count the SMALL pieces: how many are shaded? How many altogether?'
    });
  }
  $('view').innerHTML = lessonShell(L, steps, body);
}
const l2Label = () => {
  const { n, d, k } = l2;
  return k === 1 ? `${n}/${d}` : `Every piece cut into ${k} → now ${n * k} small pieces are shaded out of ${d * k}`;
};
const l2EqHtml = () => {
  const { n, d, k } = l2;
  return `${frac(n, d)}${k > 1 ? `<span class="op">=</span>${frac(`${n}×${k}`, `${d}×${k}`)}<span class="op">=</span>${frac(n * k, d * k)}` : ''}`;
};
const l2IdeaHtml = () => {
  const { n, d, k } = l2;
  return `<b>See it?</b> The shaded part <b>never moved</b>. We only drew extra lines. Cutting every piece into ${k > 1 ? k : 'k'} pieces makes the top <b>×${k > 1 ? k : 'k'}</b> AND the bottom <b>×${k > 1 ? k : 'k'}</b> — but the amount of chocolate is exactly the same. That's why ${frac(n, d)} ${k > 1 ? `= ${frac(n * k, d * k)}` : 'has many other names'}. We call them <b>equivalent fractions</b>.`;
};
// Only the bar and its captions change — the block stays exactly where it
// is and the new cut animates down it.
function l2SetK(k){
  if (l2.k === k) return;
  l2.k = k;
  const bar = $('l2bar');
  if (!bar) { renderLesson(false); return; }
  bar.innerHTML = fbar(l2.n, l2.d, { split: k, label: l2Label() });
  document.querySelectorAll('#l2chips .chip').forEach(c => c.classList.toggle('active', +c.dataset.k === k));
  $('l2eq').innerHTML = l2EqHtml();
  $('l2idea').innerHTML = l2IdeaHtml();
}
function l2SetFrac(n, d){ l2.n = n; l2.d = d; l2.k = 1; renderLesson(false); }

// Lesson 3 — Gluing pieces (simplifying, why ÷ works)

const l3 = { n: 8, d: 12, g: 1 };
function renderL3(L){
  const steps = [0,1,2];
  let body = '';
  if (lessonState.step === 0) {
    const { n, d, g } = l3;
    const canGlue = (x) => n % x === 0 && d % x === 0;
    body = `
      <h3>Gluing is the Magic Split in reverse</h3>
      <p>Here is ${frac(n, d)}. Those are a lot of small pieces! Can we <b>glue</b> them back into bigger equal pieces?</p>
      ${fbar(n, d, { glue: g, label: g === 1 ? `${n}/${d}` : `Glued in groups of ${g} → ${n / g} big pieces shaded out of ${d / g}` })}
      <div class="chip-row"><span style="align-self:center; font-weight:700; color:var(--muted);">Glue groups of:</span>
        ${[1,2,3,4].map(gg => `<button class="chip ${gg === l3.g ? 'active' : ''}" ${gg !== 1 && !canGlue(gg) ? 'disabled' : ''} onclick="l3SetG(${gg})">${gg === 1 ? 'no glue' : '÷' + gg}</button>`).join('')}
      </div>
      <div class="eq-row">${frac(n, d)}${g > 1 ? `<span class="op">=</span>${frac(`${n}÷${g}`, `${d}÷${g}`)}<span class="op">=</span>${frac(n / g, d / g)}` : ''}</div>
      <div class="idea"><b>Why dividing works:</b> gluing every ${g > 1 ? g : 'few'} small pieces into 1 big piece divides the top AND the bottom by the same number — and again, <b>the shaded amount never changes</b>. ${l3.g === 3 || (l3.n === 8 && l3.d === 12) ? 'Notice ÷3 is greyed out for 8/12: you can only glue if the group size divides BOTH numbers exactly — otherwise a shaded piece and an unshaded piece would end up glued together!' : ''}</div>
      ${nextBtn()}`;
  } else if (lessonState.step === 1) {
    body = `
      <h3>Simplest form = no more gluing possible</h3>
      <p>Keep gluing until no number (except 1) divides both the top and the bottom. That's the fraction's <b>simplest form</b> — the same amount with the fewest, biggest pieces.</p>
      <div class="eq-row">${frac(8,12)}<span class="op">=</span>${frac(4,6)}<span class="op">=</span>${frac(2,3)}</div>
      ${fbar(8, 12, { label: '8/12' })}
      ${fbar(2, 3, { label: '2/3 — simplest form: same amount, biggest pieces' })}
      <div class="idea"><b>Tip:</b> you can glue step by step (÷2, then ÷2 again) or in one big jump (÷4). You always land on the same simplest form.</div>
      ${nextBtn()}`;
  } else {
    body = quickCheckHtml({
      html: `
        <h3>Quick check</h3>
        <p>Write ${frac(6, 8)} in its simplest form. (Hint: what number divides BOTH 6 and 8?)</p>
        ${fbar(6, 8, { glue: 2 })}

      answers: { qc3n: 3, qc3d: 4 },
      feedbackGood: '6/8 = 3/4. Glue pieces in pairs: 6÷2 = 3 and 8÷2 = 4!',
      feedbackBad: 'Glue the small pieces two by two. How many big shaded pieces? How many big pieces altogether?'
    });
  }
  $('view').innerHTML = lessonShell(L, steps, body);
}
function l3SetG(g){ l3.g = g; renderLesson(false); }

function checkPractice(){
  const q = practice.q;
  const fb = $('pFeedback');
  let allOk = true, anyEmpty = false;
  const got = {};
  for (const [id, want] of Object.entries(q.answers)) {
    const v = getNum(id);
    got[id] = v;
    if (v === null) { anyEmpty = true; markBlank(id, false); allOk = false; continue; }
    const ok = v === want;
    markBlank(id, ok);
    if (!ok) allOk = false;
  }
  // some questions accept an equivalent-fraction answer (e.g. already simplified)
  let altNote = '';
  if (!allOk && !anyEmpty && q.acceptEquivalent) {
    const alt = q.acceptEquivalent(got);
    if (alt) { allOk = true; altNote = alt; clearBlankMarks(); Object.keys(q.answers).forEach(id => markBlank(id, true)); }
  }
  fb.classList.add('show');
  if (allOk) {
    fb.className = 'feedback show good';
    fb.innerHTML = `<div class="fb-title">✅ ${altNote || q.praise || 'Correct — great thinking!'}</div>`;
    $('pCheckBtn').style.display = 'none';
    $('pNextBtn').style.display = 'inline-block';
    $('pCoachRow').style.display = 'none';
    if (practice.firstTry && !practice.answered) { addStars(1, practice.skill); toast('⭐ +1 star!'); }
    practice.answered = true;
  } else {
    fb.className = 'feedback show bad';
    let msg = anyEmpty ? 'Fill in every box with a number, then check again.' : (q.diagnose ? q.diagnose(got) : null) || 'Not quite — look at the picture and try again.';
    fb.innerHTML = `<div class="fb-title">Not yet!</div>${msg}`;
    practice.firstTry = false;
    $('pCoachRow').style.display = 'flex';
  }
}

// ---- generators ----
function genName(){
  const d = pick([3,4,5,6,8,10,12]);
  const n = ri(1, d - 1);
  return {
    text: `Write the fraction shown in the picture.`,
    html: `<p>Write the fraction shown in the picture:</p>${fbar(n, d)}
      <div class="eq-row">shaded part = ${fracBlank('bn','bd')}</div>`,
    answers: { bn: n, bd: d },
    praise: `${n} shaded out of ${d} equal pieces = ${n}/${d}.`,
    expected: `${n}/${d}`,
    diagnose(got){
      if (got.bn === d && got.bd === n) return 'You swapped them! The <b>top</b> counts the shaded pieces, the <b>bottom</b> counts ALL the equal pieces.';
      if (got.bd === d && got.bn === d - n) return 'You counted the <b>unshaded</b> pieces. Count the shaded (green) ones for the top.';
      return 'Top = shaded pieces. Bottom = all the equal pieces.';
    }
  };
}
function genEquiv(){
  const d = pick([2,3,4,5,6]);
  const n = ri(1, d - 1);
  const kMax = Math.floor(12 / d);
  const k = ri(2, Math.max(2, kMax));
  const missingTop = Math.random() < 0.6;
  const text = missingTop
    ? `${n}/${d} = ?/${d * k}`
    : `${n}/${d} = ${n * k}/?`;
  return {
    text: `Find the missing number: ${text}`,
    html: `<p>Find the missing number. (Think: each piece is cut into <b>${k}</b>.)</p>
      ${fbar(n, d, { split: k, label: `${n}/${d}, with every piece cut into ${k}` })}
      <div class="eq-row">${frac(n, d)}<span class="op">=</span>${missingTop
        ? `<span class="frac"><span class="fn">${blank('bx')}</span><span class="fd">${d * k}</span></span>`
        : `<span class="frac"><span class="fn">${n * k}</span><span class="fd" style="padding-top:6px;">${blank('bx')}</span></span>`}</div>`,
    answers: { bx: missingTop ? n * k : d * k },
    praise: `${n}/${d} = ${n * k}/${d * k} — top and bottom both ×${k}.`,
    expected: `${n}/${d} = ${n * k}/${d * k}`,
    diagnose(got){
      const diff = d * k - d;
      if (missingTop && got.bx === n + diff) return `You <b>added</b> ${diff} to the top because the bottom grew by ${diff}. But equal fractions come from <b>multiplying</b>, not adding! The bottom went ${d} → ${d * k}, that's <b>×${k}</b>. Do the same to the top.`;
      if (missingTop && got.bx === n + k) return `Careful — the bottom was <b>multiplied</b> by ${k}, not increased by ${k}. Do the same to the top: ${n} × ${k}.`;
      return `The bottom ${missingTop ? `went from ${d} to ${d * k} — that's ×${k}` : `must grow the same way as the top (×${k})`}. Whatever you do to one number, do to the other!`;
    }
  };
}
function genSimplify(){
  const [p, qd] = pick([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,5],[5,6],[1,6]]);
  const kMax = Math.floor(12 / qd);
  const k = ri(2, Math.max(2, kMax));
  const n = p * k, d = qd * k;
  return {
    text: `Write ${n}/${d} in its simplest form.`,
    html: `<p>Write this fraction in its <b>simplest form</b>. (Hint: what number divides BOTH ${n} and ${d}?)</p>
      ${fbar(n, d, { glue: k, label: `${n}/${d} — the bold lines show the glue groups` })}
      <div class="eq-row">${frac(n, d)}<span class="op">=</span>${fracBlank('bn','bd')}</div>`,
    answers: { bn: p, bd: qd },
    praise: `${n}/${d} = ${p}/${qd} — divide top and bottom by ${k}.`,
    expected: `${n}/${d} = ${p}/${qd}`,
    diagnose(got){
      if (got.bn != null && got.bd != null && got.bd !== 0 && got.bn * d === n * got.bd) {
        const g = gcd(got.bn, got.bd);
        if (g > 1) return `${got.bn}/${got.bd} IS equal to ${n}/${d} — nice! But you can still glue more: ${got.bn} and ${got.bd} can both be divided by ${g}. Keep going to the simplest form.`;
      }
      return `Find a number that divides BOTH the top and the bottom exactly, and divide them together. The picture's bold lines show the groups.`;
    }
  };
}
function genLike(){
  const d = pick([4,5,6,8,10,12]);
  const isAdd = Math.random() < 0.6;
  let a, b;
  if (isAdd) { a = ri(1, d - 2); b = ri(1, d - a - 1); }
  else { a = ri(2, d - 1); b = ri(1, a - 1); }
  const res = isAdd ? a + b : a - b;
  return {
    text: `${a}/${d} ${isAdd ? '+' : '−'} ${b}/${d} = ?`,
    html: `<p>Work it out. Remember: the pieces are all the <b>same size</b>.</p>
      ${fbar(a, d, { label: `${a}/${d}` })}
      <div class="eq-row">${frac(a, d)}<span class="op">${isAdd ? '+' : '−'}</span>${frac(b, d)}<span class="op">=</span>${fracBlank('bn','bd')}</div>`,
    answers: { bn: res, bd: d },
    praise: `${a} ${isAdd ? '+' : '−'} ${b} = ${res} pieces, each still a ${d === 2 ? 'half' : '1/' + d} — so ${res}/${d}.`,
    expected: `${res}/${d}`,
    acceptEquivalent(got){
      if (got.bn != null && got.bd != null && got.bd !== 0 && got.bn * d === res * got.bd && gcd(got.bn, got.bd) === 1 && got.bd < d)
        return `${got.bn}/${got.bd} is exactly right — you even gave the simplest form. Superstar! (${res}/${d} was also accepted.)`;
      return null;
    },
    diagnose(got){
      if (got.bd === d + d) return `You ${isAdd ? 'added' : 'changed'} the bottoms! But ${a + b <= d && isAdd ? `${a + b}/${d + d} is only HALF of the real total — half the chocolate would vanish into thin air! ` : ''}The bottom number is the <b>size</b> of the pieces — ${isAdd ? 'adding' : 'subtracting'} pieces doesn't change their size. Keep the bottom as ${d} and only ${isAdd ? 'add' : 'subtract'} the tops.`;
      if (got.bn === (isAdd ? a - b : a + b)) return `Check the sign — this question is ${isAdd ? 'an addition (+)' : 'a subtraction (−)'}.`;
      return `The pieces stay the same size (bottom = ${d}). Just ${isAdd ? 'count all the pieces: ' + a + ' + ' + b : 'take away: ' + a + ' − ' + b}.`;
    }
  };
}
function genRelated(){
  const [ds, db] = pick([[2,4],[2,6],[2,8],[2,10],[2,12],[3,6],[3,9],[3,12],[4,8],[4,12],[5,10],[6,12]]);
  const k = db / ds;
  const isAdd = Math.random() < 0.6;
  let a, c; // a/ds  and  c/db
  if (isAdd) {
    a = ri(1, ds - 1);
    const room = db - a * k;
    if (room < 1) return genRelated();
    c = ri(1, Math.min(db - 1, room));
  } else {
    a = ri(1, ds - 1);
    c = ri(1, a * k - 1);
  }
  const conv = a * k;
  const res = isAdd ? conv + c : conv - c;
  const who = pick(['Ali', 'Siti', 'Ben', 'Mei', 'Raju', 'Nora']);
  const item = pick(['chocolate bar', 'pizza', 'cake', 'pie']);
  const story = (fr) => isAdd
    ? `${who} ate ${fr(a, ds)} of a ${item} in the morning and another ${fr(c, db)} of the ${item} in the afternoon. What fraction of the ${item} did ${who} eat altogether?`
    : `${who} had ${fr(a, ds)} of a ${item}. ${who} ate ${fr(c, db)} of the ${item}. What fraction of the ${item} is left?`;
  return {
    text: `${story((n, d) => `${n}/${d}`)} (${a}/${ds} ${isAdd ? '+' : '−'} ${c}/${db} = ?)`,
    html: `<p>${story(frac)}</p>
      <div class="eq-row">${frac(a, ds)}<span class="op">${isAdd ? '+' : '−'}</span>${frac(c, db)}<span class="op">=</span><span class="op">?</span></div>
      <p>The pieces are different sizes — <b>match them first</b>, then count!</p>
      ${fbar(a, ds, { split: k, label: `${a}/${ds} with every piece cut into ${k} → ${db === 2 ? 'halves' : db + 'ths'}` })}
      <div class="eq-row">Step 1: ${frac(a, ds)}<span class="op">=</span><span class="frac"><span class="fn">${blank('bc')}</span><span class="fd">${db}</span></span></div>
      <div class="eq-row">Step 2: <span class="frac"><span class="fn">?</span><span class="fd">${db}</span></span><span class="op">${isAdd ? '+' : '−'}</span>${frac(c, db)}<span class="op">=</span>${fracBlank('bn','bd')}</div>`,
    answers: { bc: conv, bn: res, bd: db },
    praise: `${a}/${ds} = ${conv}/${db}, then ${conv} ${isAdd ? '+' : '−'} ${c} = ${res} pieces of size 1/${db}.`,
    expected: `${a}/${ds} = ${conv}/${db}; answer ${res}/${db}`,
    diagnose(got){
      if (got.bc !== conv) return `Start with Step 1. Each piece of ${frac(a, ds)} is cut into ${k}, so multiply top and bottom by ${k}: ${a} × ${k} = ?`;
      if (got.bd === ds + db) return `You added the bottoms! Once the pieces match (all ${db}ths), the size doesn't change any more — the bottom stays <b>${db}</b>. Only count the tops.`;
      return `Step 1 is right! Now all pieces are ${db}ths — the same size. Count: ${conv} ${isAdd ? '+' : '−'} ${c} pieces.`;
    }
  };
}
function genOfNumber(){
  const den = pick([2,3,4,5,6]);
  const per = ri(2, 6);
  const total = den * per;
  const num = den === 2 ? 1 : ri(1, den - 1);
  const ans = per * num;
  const [who, thing, emoji] = pick([
    ['Ali','stickers','⭐'], ['Siti','sweets','🍬'], ['Ben','marbles','🔵'],
    ['Mei','cookies','🍪'], ['Raju','stamps','📮'], ['Nora','beads','🟣']
  ]);
  return {
    text: `${who} has ${total} ${thing} and gives away ${num}/${den} of them. How many is that?`,
    html: `<p>${who} has <b>${total} ${thing}</b>. ${who} gives away ${frac(num, den)} of them.<br>How many ${thing} is that?</p>
      ${emojiSet(total, 0, emoji, emoji, { size: '1.2rem', label: `${total} ${thing} altogether` })}
      <div class="eq-row">${frac(num, den)} of ${total}<span class="op">=</span>${blank('bx')}</div>`,
    answers: { bx: ans },
    praise: `${total} ÷ ${den} = ${per}${num > 1 ? `, then ${per} × ${num} = ${ans}` : ''}.`,
    expected: `${num}/${den} of ${total} = ${ans}`,
    diagnose(got){
      if (got.bx === per && num > 1) return `That is ${frac(1, den)} of ${total}. You need <b>${num}</b> of those groups: ${per} × ${num}.`;
      if (got.bx === total - ans) return `You worked out how many are <b>left</b>. The question asks how many were <b>given away</b>.`;
      if (got.bx === total - den) return `Careful — the bottom number is not taken away. It says how many <b>equal groups</b> to share into.`;
      return `Share the ${total} ${thing} into <b>${den}</b> equal groups (${total} ÷ ${den} = ?), then take ${num} group${num > 1 ? 's' : ''}.`;
    }
  };
}

  { n1:1, d1:2, op:'+', n2:1, d2:4, story:(f)=>`Kumar ate ${f(1,2)} of a pizza and his brother ate ${f(1,4)} of the same pizza. What fraction of the pizza did they eat altogether?` },
  { n1:1, d1:3, op:'+', n2:1, d2:6, story:(f)=>`Siti ate ${f(1,3)} of a cake and Ali ate ${f(1,6)} of the same cake. What fraction of the cake did they eat altogether?` },
  { n1:3, d1:4, op:'−', n2:1, d2:8, story:(f)=>`Ben had ${f(3,4)} of a chocolate bar. He ate ${f(1,8)} of the bar. What fraction of the bar is left?` },
  { n1:2, d1:5, op:'+', n2:3, d2:10, story:(f)=>`A bottle was ${f(2,5)} full of water. Mei poured in another ${f(3,10)} of the bottle. What fraction of the bottle is filled now?` },
  { n1:1, d1:2, op:'−', n2:1, d2:6, story:(f)=>`Nora had ${f(1,2)} of a watermelon. She gave ${f(1,6)} of the watermelon to her neighbour. What fraction of the watermelon is left?` },
  { n1:2, d1:3, op:'+', n2:1, d2:9, story:(f)=>`Raju painted ${f(2,3)} of a fence, then painted another ${f(1,9)} of it. What fraction of the fence has he painted?` },
  { n1:5, d1:6, op:'−', n2:1, d2:3, story:(f)=>`After dinner, ${f(5,6)} of Aisha's pie was left. Her family then ate ${f(1,3)} of the pie for supper. What fraction of the pie is left now?` },
  { n1:3, d1:4, op:'+', n2:1, d2:12, story:(f)=>`A pizza is cut into 12 equal slices. Wei Ming ate ${f(3,4)} of the pizza and his sister ate ${f(1,12)} of it. What fraction of the pizza did they eat altogether?` },
  { n1:7, d1:8, op:'−', n2:1, d2:2, story:(f)=>`A loaf of bread was ${f(7,8)} whole. Priya used ${f(1,2)} of the loaf to make sandwiches. What fraction of the loaf is left?` },
  { n1:1, d1:4, op:'+', n2:5, d2:12, story:(f)=>`Kumar drank ${f(1,4)} of a bottle of milk in the morning and ${f(5,12)} of the bottle at night. What fraction of the bottle did he drink?` },
];

function bankQuestion(spec){
  const { n1, d1, op, n2, d2, story } = spec;
  const isAdd = op === '+';
  const sign = isAdd ? '+' : '−';
  const D = Math.max(d1, d2);
  const plain = (n, d) => `${n}/${d}`;
  const question = `<p>${story(frac)}</p>
    <div class="eq-row">${frac(n1, d1)}<span class="op">${sign}</span>${frac(n2, d2)}<span class="op">=</span><span class="op">?</span></div>`;
  const text = `${story(plain)} (${n1}/${d1} ${sign} ${n2}/${d2} = ?)`;
  const simplerOk = (res) => (got) => {
    if (got.bn != null && got.bd != null && got.bd !== 0 && got.bn * D === res * got.bd && gcd(got.bn, got.bd) === 1 && got.bd < D)
      return `${got.bn}/${got.bd} is exactly right — you even gave the simplest form. Superstar! (${res}/${D} was also accepted.)`;
    return null;
  };

  if (d1 === d2) {
    const res = isAdd ? n1 + n2 : n1 - n2;
    return {
      text,
      html: `${question}
        <p>The pieces are already the <b>same size</b> — so just count them.</p>
        ${fbar(n1, d1, { label: `${n1}/${d1}` })}
        <div class="eq-row">${frac(n1, d1)}<span class="op">${sign}</span>${frac(n2, d2)}<span class="op">=</span>${fracBlank('bn','bd')}</div>`,
      answers: { bn: res, bd: D },
      praise: `${n1} ${sign} ${n2} = ${res} pieces, each still 1/${D} — so ${res}/${D}.`,
      expected: `${n1}/${d1} ${sign} ${n2}/${d2} = ${res}/${D}`,
      acceptEquivalent: simplerOk(res),
      diagnose(got){
        if (got.bd === d1 + d2) return `You ${isAdd ? 'added' : 'changed'} the bottoms! The bottom number is the <b>size</b> of the pieces, and ${isAdd ? 'adding' : 'taking away'} pieces never changes their size. Keep the bottom as <b>${D}</b> and only work on the tops.`;
        if (got.bn === (isAdd ? n1 - n2 : n1 + n2)) return `Check the sign — this question is ${isAdd ? 'an addition (+)' : 'a subtraction (−)'}.`;
        return `All the pieces are ${D}ths, so the bottom stays ${D}. Now just ${isAdd ? `count them all: ${n1} + ${n2}` : `take away: ${n1} − ${n2}`}.`;
      }
    };
  }

  // one fraction has bigger pieces — re-cut it so both match
  const firstSmaller = d1 < d2;
  const sn = firstSmaller ? n1 : n2, sd = firstSmaller ? d1 : d2;
  const k = D / sd;
  const conv = sn * k;
  const res = isAdd ? conv + (firstSmaller ? n2 : n1) : (firstSmaller ? conv - n2 : n1 - conv);
  const step2 = firstSmaller
    ? `<span class="frac"><span class="fn">?</span><span class="fd">${D}</span></span><span class="op">${sign}</span>${frac(n2, d2)}`
    : `${frac(n1, d1)}<span class="op">${sign}</span><span class="frac"><span class="fn">?</span><span class="fd">${D}</span></span>`;
  return {
    text,
    html: `${question}
      <p>The pieces are different sizes — <b>match them first</b>, then count!</p>
      ${fbar(sn, sd, { split: k, label: `${sn}/${sd} with every piece cut into ${k} → ${D}ths` })}
      <div class="eq-row">Step 1: ${frac(sn, sd)}<span class="op">=</span><span class="frac"><span class="fn">${blank('bc')}</span><span class="fd">${D}</span></span></div>
      <div class="eq-row">Step 2: ${step2}<span class="op">=</span>${fracBlank('bn','bd')}</div>`,
    answers: { bc: conv, bn: res, bd: D },
    praise: `${sn}/${sd} = ${conv}/${D}, then ${firstSmaller ? `${conv} ${sign} ${n2}` : `${n1} ${sign} ${conv}`} = ${res} pieces of size 1/${D}.`,
    expected: `${sn}/${sd} = ${conv}/${D}; answer ${res}/${D}`,
    acceptEquivalent(got){ return got.bc === conv ? simplerOk(res)(got) : null; },
    diagnose(got){
      if (got.bc !== conv) return `Start with Step 1. Every piece of ${frac(sn, sd)} is cut into ${k}, so multiply the top and the bottom by ${k}: ${sn} × ${k} = ?`;
      if (got.bd === d1 + d2 || got.bd === sd + D) return `You added the bottoms! Once the pieces match (all ${D}ths), their size stops changing — the bottom stays <b>${D}</b>. Only count the tops.`;
      return `Step 1 is right! Every piece is now a ${D}th, so just ${isAdd ? 'count' : 'take away'}: ${firstSmaller ? `${conv} ${sign} ${n2}` : `${n1} ${sign} ${conv}`}.`;
    }
  };
}

// ---- AI Coach for a wrong practice answer ----
async function askCoach(){

  if (!aiReady()) { box.style.display = 'block'; box.innerHTML = `<div class="ai-title">🤖 AI Coach</div>Sorry, the AI is not available right now. Look at the picture and the hint above — you can do it!`; return; }
  const entries = Object.keys(q.answers).map(id => `${id}: ${($(id)?.value ?? '').trim() || '(empty)'}`).join(', ');
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>Coach is thinking…`;
  try {
    const prompt = `You are a warm, patient maths coach for a Primary 3 child (about 9 years old) in Singapore, helping with fractions.

The child is solving: ${q.text}
The correct working: ${q.expected}
The child's (wrong) answers to the blanks: ${entries}

Explain WHY their answer doesn't work using the idea of equal-sized pieces of a bar (not just the rule). Be encouraging, never scolding. Use very simple words and short sentences. Do NOT give the final answer — end with one small guiding question that leads them to the next step.

Return STRICT JSON only: {"help": "your explanation, 2-4 short sentences"}`;

  }
}

function examToggleCat(id){

}
function examAllCats(on){

}
function examSetSize(n){ examSetup.size = n; renderExamHome(); }

function startExam(){
  const cats = EXAM_CATS.filter(c => examSetup.cats.includes(c.id));
  if (!cats.length) { toast('Choose at least one topic first.'); return; }
  const qs = [];
  for (let i = 0; i < examSetup.size; i++) {

    qs.push({ cat: c.id, q: c.gen(), given: {}, strokes: [], padOpen: false });

  renderExamQ();
}

const examAnswered = (item) => Object.values(item.given || {}).some(v => String(v).trim() !== '');

// Everything typed into the blanks is kept on the question itself, so moving
// back and forth through the paper never loses an answer.
function examCapture(){
  if (!exam || exam.submitted) return;
  const item = exam.qs[exam.idx];
  if (!item) return;
  Object.keys(item.q.answers).forEach(id => { const el = $(id); if (el) item.given[id] = el.value; });
}
function examRestore(item){
  Object.keys(item.q.answers).forEach(id => { const el = $(id); if (el && item.given[id] != null) el.value = item.given[id]; });
}
function examGo(i){
  examCapture();
  exam.idx = Math.max(0, Math.min(exam.qs.length - 1, i));
  renderExamQ();
}
function examNext(){ examGo(exam.idx + 1); }
function examPrev(){ examGo(exam.idx - 1); }
function quitExam(){
  if (!window.confirm('Quit the exam? Your answers and workings will be lost.')) return;
  exam = null;
  renderExamHome();
}

function renderExamQ(){

// ---------------------------------------------------------------
// Working area — write the working with a finger or an Apple Pencil
//   Strokes are stored as points in 0-1 space on the question itself, so
//   they survive navigation, a rotation and a resize.
// ---------------------------------------------------------------
const PALM_CONTACT = 55;   // iPads report fingertips up to ~45px; above this is a palm
const PAD_REF_W = 700;     // stroke widths are quoted at this pad width
const padState = { tool: 'pen', item: null, canvas: null, ctx: null, stroke: null, activeId: null, pencilSeen: false };

function workPadHtml(item){
  return `
    <div class="work">
      <button class="btn btn-soft work-toggle" onclick="togglePad()">${item.padOpen ? '▼ Hide working area' : '✏️ Working area'}</button>
      ${item.padOpen ? `
        <div class="work-bar">
          <button class="work-tool ${padState.tool === 'pen' ? 'active' : ''}" onclick="padTool('pen')" title="Pen">✏️</button>
          <button class="work-tool ${padState.tool === 'eraser' ? 'active' : ''}" onclick="padTool('eraser')" title="Rub out">🧽</button>
          <button class="work-tool" onclick="padUndo()" title="Undo the last stroke">↩</button>
          <button class="work-tool" onclick="padClear()" title="Clear the whole pad">🗑</button>
          <span class="work-hint" id="padHint">${padState.pencilSeen ? 'Pencil writes · fingers scroll' : 'Write your working here'}</span>
        </div>
        <div class="work-pad-wrap"><canvas class="work-pad${padState.pencilSeen ? ' stylus' : ''}" id="workPad"></canvas></div>` : ''}
    </div>`;
}
function togglePad(){
  const item = exam.qs[exam.idx];
  examCapture();
  item.padOpen = !item.padOpen;
  renderExamQ();
}
function padTool(t){
  padState.tool = t;
  document.querySelectorAll('.work-tool').forEach(b => b.classList.remove('active'));
  const which = t === 'pen' ? 0 : 1;
  document.querySelectorAll('.work-tool')[which]?.classList.add('active');
}
function padUndo(){
  if (!padState.item || !padState.item.strokes.length) return;
  padState.item.strokes.pop();
  padRedraw();
}
function padClear(){
  if (!padState.item) return;
  padState.item.strokes = [];
  padRedraw();
}

function mountPad(item){
  padState.item = item;
  padState.canvas = null;
  padState.ctx = null;
  padState.stroke = null;
  padState.activeId = null;
  if (!item.padOpen) return;
  const c = $('workPad');
  if (!c) return;
  padState.canvas = c;
  padState.ctx = c.getContext('2d');
  padSize();
  c.addEventListener('pointerdown', padDown);
  c.addEventListener('pointermove', padMove);
  c.addEventListener('pointerup', padUp);
  c.addEventListener('pointercancel', padUp);
  // A capture dropped by the browser mid-stroke would otherwise leave the pad
  // locked out for every later touch.
  c.addEventListener('lostpointercapture', padUp);
}

function padSize(){
  const c = padState.canvas;
  if (!c) return;
  const rect = c.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.max(1, Math.round(rect.width * dpr));
  c.height = Math.max(1, Math.round(rect.height * dpr));
  padRedraw();
}
function drawStrokes(ctx, strokes, w, h){
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#243932';
  (strokes || []).forEach(s => {
    if (!s.pts.length) return;
    ctx.lineWidth = Math.max(1, s.w * (w / PAD_REF_W));
    ctx.beginPath();
    ctx.moveTo(s.pts[0].x * w, s.pts[0].y * h);
    if (s.pts.length === 1) ctx.lineTo(s.pts[0].x * w + 0.01, s.pts[0].y * h);
    else for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x * w, s.pts[i].y * h);
    ctx.stroke();
  });
}
function padRedraw(){
  const { canvas: c, ctx, item } = padState;
  if (!c || !ctx) return;
  ctx.clearRect(0, 0, c.width, c.height);
  drawStrokes(ctx, item ? item.strokes : [], c.width, c.height);
}
function padPoint(e){
  const r = padState.canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
// Draw only the newest segment — redrawing every stroke on every move is what
// makes handwriting stutter on an iPad.
function padDrawSegment(a, b, width){
  const { canvas: c, ctx } = padState;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#243932';
  ctx.lineWidth = Math.max(1, width * (c.width / PAD_REF_W));
  ctx.beginPath();
  ctx.moveTo(a.x * c.width, a.y * c.height);
  ctx.lineTo(b.x * c.width, b.y * c.height);
  ctx.stroke();
}
function padErase(pt){
  const item = padState.item;
  const r = padState.canvas.getBoundingClientRect();
  const rx = 16 / r.width, ry = 16 / r.height;          // ~16px finger-sized nib
  const before = item.strokes.length;
  item.strokes = item.strokes.filter(s =>
    !s.pts.some(q => Math.abs(q.x - pt.x) < rx && Math.abs(q.y - pt.y) < ry));
  if (item.strokes.length !== before) padRedraw();
}
function padDown(e){
  // A palm-sized contact patch never starts anything.
  if (e.pointerType === 'touch' && (e.width > PALM_CONTACT || e.height > PALM_CONTACT)) return;
  // First time a stylus is used, hand the pad over to it: fingers go back to
  // scrolling so a hand can rest on the screen.
  if (e.pointerType === 'pen' && !padState.pencilSeen) {
    padState.pencilSeen = true;
    padState.canvas.classList.add('stylus');
    const hint = $('padHint');
    if (hint) hint.textContent = 'Pencil writes · fingers scroll';
    toast('✏️ Apple Pencil detected — the Pencil writes, fingers scroll the page.');
  }
  if (padState.pencilSeen && e.pointerType === 'touch') return;
  if (padState.activeId !== null && e.pointerId !== padState.activeId) return;  // second finger / palm
  e.preventDefault();
  padState.activeId = e.pointerId;
  try { padState.canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const pt = padPoint(e);
  if (padState.tool === 'eraser') { padErase(pt); return; }
  padState.stroke = { w: 2.6, pts: [pt] };
  padState.item.strokes.push(padState.stroke);
  padDrawSegment(pt, { x: pt.x + 0.0001, y: pt.y }, padState.stroke.w);
}
function padMove(e){
  if (padState.activeId === null || e.pointerId !== padState.activeId) return;
  e.preventDefault();
  if (padState.tool === 'eraser') { padErase(padPoint(e)); return; }
  const s = padState.stroke;
  if (!s) return;
  // An Apple Pencil samples far faster than pointermove fires; the extra
  // samples only exist here, and dropping them is what makes quick
  // handwriting come out angular.
  let samples = (e.getCoalescedEvents && e.getCoalescedEvents()) || null;
  if (!samples || !samples.length) samples = [e];
  samples.forEach(se => {
    const pt = padPoint(se);
    const last = s.pts[s.pts.length - 1];
    if (Math.abs(pt.x - last.x) + Math.abs(pt.y - last.y) < 0.0015) return;
    s.pts.push(pt);
    padDrawSegment(last, pt, s.w);
  });
}
function padUp(e){
  if (padState.activeId === null || (e && e.pointerId !== padState.activeId)) return;
  padState.activeId = null;
  padState.stroke = null;
}

// ---------------------------------------------------------------
// Marking
// ---------------------------------------------------------------
function gradeAnswers(q, got){
  let ok = true, anyEmpty = false;
  for (const [id, want] of Object.entries(q.answers)) {
    if (got[id] === null) { anyEmpty = true; ok = false; continue; }
    if (got[id] !== want) ok = false;
  }
  if (!ok && !anyEmpty && q.acceptEquivalent && q.acceptEquivalent(got)) ok = true;
  return ok;
}
function formatGiven(q, given){
  const g = (id) => { const v = String(given[id] ?? '').trim(); return v === '' ? '—' : v; };
  const ids = Object.keys(q.answers);
  const parts = [];
  if (ids.includes('bc')) parts.push(`step 1: ${g('bc')}`);
  if (ids.includes('bn') && ids.includes('bd')) parts.push(`${g('bn')}/${g('bd')}`);
  else ids.filter(id => id !== 'bc').forEach(id => parts.push(g(id)));
  return parts.join(' · ');
}
// The working, drawn small enough to sit in the report.
function workingThumb(strokes){
  if (!strokes || !strokes.length) return '';
  const w = 480, h = Math.round(w * 2 / 3);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  drawStrokes(ctx, strokes, w, h);
  return `<div class="res-work"><img src="${c.toDataURL('image/png')}" alt="Your working"></div>`;
}

function finishExam(){
  examCapture();
  const results = exam.qs.map(item => {
    const got = {};
    Object.keys(item.q.answers).forEach(id => {
      const v = String(item.given[id] ?? '').trim();
      got[id] = /^\d+$/.test(v) ? parseInt(v, 10) : null;
    });
    return { item, got, ok: gradeAnswers(item.q, got) };
  });
  exam.results = results;
  exam.score = results.filter(r => r.ok).length;
  exam.submitted = true;
  if (!exam.starred) {
    exam.starred = true;
    if (exam.score) { addStars(exam.score, 'exam'); toast(`⭐ +${exam.score} star${exam.score > 1 ? 's' : ''}!`); }
  }
  renderExamResults();
}

function renderExamResults(){
  const n = exam.qs.length, s = exam.score;
  const pct = Math.round(s / n * 100);
  const word = pct === 100 ? 'Perfect paper! 🎉' : pct >= 80 ? 'Really strong work! 🌟' :
               pct >= 50 ? 'A good effort — look at the ones you missed.' : 'Keep going — check the topics below and try again.';
  $('view').innerHTML = `
    <div class="card" style="text-align:center;">
      <h2>📝 Exam marked</h2>
      <div class="res-score">${s} / ${n}</div>
      <p class="lede" style="margin-top:6px;">${pct}% · ${word}</p>
      <div class="btn-row">
        <button class="btn btn-green" onclick="startExam()">🔁 Another paper (same topics)</button>
        <button class="btn btn-ghost" onclick="goTab('exam')">← Change topics</button>
      </div>
    </div>
    <div class="card">
      <h3>Every question</h3>
      <p class="lede">Your answer, the right answer, and the working you wrote.</p>
      ${exam.results.map((r, i) => {
        const cat = EXAM_CATS.find(c => c.id === r.item.cat);
        return `
        <div class="res-item ${r.ok ? 'ok' : 'bad'}">
          <div class="res-head">${r.ok ? '✅' : '❌'} Question ${i + 1}<span class="exam-tag">${cat.emoji} ${cat.title}</span></div>
          <div class="res-q">${esc(r.item.q.text)}</div>
          <div class="res-ans">You wrote: <b>${esc(formatGiven(r.item.q, r.item.given))}</b></div>
          <div class="res-ans">${r.ok ? `Well done — ${esc(r.item.q.praise || 'correct!')}` : `Correct answer: <b>${esc(r.item.q.expected)}</b>`}</div>
          ${workingThumb(r.item.strokes)}
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo({ top: 0 });
}

  $('view').innerHTML = `

      <h2>🤖 Teach the AI</h2>

let explainIdx = 0;
function openExplain(i){
  explainIdx = i;
  const e = EXPLAIN_QS[i];
  $('view').innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
        <h2 style="margin:0;">${e.emoji} Teach the AI</h2>
        <button class="btn btn-ghost" onclick="goTab('explain')">← All questions</button>
      </div>
      <p style="font-size:1.05rem; font-weight:700;">${esc(e.q)}</p>
      ${e.visual ? e.visual() : ''}
      <textarea class="explain-input" id="explainText" placeholder="Type your explanation here, like you're teaching a friend…"></textarea>
      <div class="btn-row">
        <button class="btn btn-green" id="explainSend" onclick="sendExplain()">Send to the AI teacher 🚀</button>
      </div>
      <div class="ai-box" id="explainResult" style="display:none;"></div>
      <div class="btn-row" id="explainAgainRow" style="display:none;">
        <button class="btn btn-soft" onclick="openExplain(${i})">✍️ Try again</button>

}

async function sendExplain(){
  const e = EXPLAIN_QS[explainIdx];
  const text = ($('explainText').value || '').trim();
  const box = $('explainResult');
  if (text.length < 5) { toast('Write your explanation first! ✍️'); return; }
  if (!aiReady()) {
    box.style.display = 'block';
    box.innerHTML = `<div class="ai-title">🤖 AI teacher</div>Sorry, the AI is not available right now. Please try again later.`;
    return;
  }
  const btn = $('explainSend');
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>The AI teacher is reading…`;
  try {
    const prompt = `You are a warm, encouraging maths teacher marking a Primary 3 (about 9 years old) Singapore student's written explanation about fractions. Mark the UNDERSTANDING of the maths idea — completely ignore spelling, grammar and punctuation mistakes. The child may write in simple or broken English; that is fine.

QUESTION GIVEN TO THE STUDENT:
${e.q}

WHAT A GOOD ANSWER SHOWS (marking guide):
${e.rubric}

STUDENT'S EXPLANATION:
"""${text}"""

Award stars for understanding:
- 3 = the key idea is clearly there (even in kid words)
- 2 = mostly understands, one small gap or fuzzy part
- 1 = tried, but the main idea is missing or a real misconception shows
- 0 = off-topic or no real attempt

Return STRICT JSON only:
{"stars": 0-3, "praise": "one warm sentence about what they got right (or their effort)", "fix": "one simple sentence on the most important thing to add or correct — empty string if 3 stars", "tip": "one short, concrete tip or picture-idea to deepen understanding"}
Use words a 9-year-old easily reads. Short sentences. Never sarcastic, never harsh.`;
    const raw = await askGemini(prompt, { maxOutputTokens: 500, temperature: 0.4 });
    const out = parseAIJson(raw);
    let stars = parseInt(out.stars, 10);
    if (!(stars >= 0 && stars <= 3)) stars = 0;
    const prevBest = progress.explainBest[e.id] || 0;
    if (stars > prevBest) {
      progress.explainBest[e.id] = stars;
      saveProgress();
      addStars(stars - prevBest, 'explain');
    }
    box.style.display = 'block';
    box.innerHTML = `
      <div class="ai-title">🤖 The AI teacher says:</div>
      <div class="ai-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p style="margin:6px 0;"><b>👍 </b>${esc(out.praise || 'Good try!')}</p>
      ${out.fix ? `<p style="margin:6px 0;"><b>🔧 </b>${esc(out.fix)}</p>` : ''}
      ${out.tip ? `<p style="margin:6px 0;"><b>💡 </b>${esc(out.tip)}</p>` : ''}
      ${stars > prevBest ? `<p style="margin:10px 0 0; font-weight:800; color:var(--green-deep);">+${stars - prevBest} star${stars - prevBest > 1 ? 's' : ''} added to your total! 🎉</p>` : ''}`;
    $('explainAgainRow').style.display = 'flex';
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (err) {
    console.warn('explain marking error', err);
    box.style.display = 'block';
    box.innerHTML = `<div class="ai-title">🤖 AI teacher</div>Oops, something went wrong reaching the AI. Please try sending again!`;
  } finally {
    btn.disabled = false; btn.innerHTML = `Send to the AI teacher 🚀`;
  }
}

// iOS shrinks the *visual* viewport when the keyboard opens but never fires
// `resize`, so anything sized in vh could end up behind the keyboard.
if (window.visualViewport) {
  const syncVVH = () => document.documentElement.style.setProperty('--vvh', window.visualViewport.height + 'px');
  window.visualViewport.addEventListener('resize', syncVVH);
  syncVVH();
}
// Rotating an iPad changes the pad's pixel size; strokes are stored in 0-1
// space, so re-sizing the canvas and redrawing keeps the working intact.
let resizeSettle = null;
const onViewportResize = () => {
  clearTimeout(resizeSettle);
  resizeSettle = setTimeout(() => { if (padState.canvas) padSize(); }, 160);
};
window.addEventListener('resize', onViewportResize);
window.addEventListener('orientationchange', onViewportResize);

// The on-screen keyboard owns the bottom of the screen while a blank is being
// filled in — see body.typing in the stylesheet.
$('view').addEventListener('focusin', (e) => {
  if (e.target.classList && e.target.classList.contains('blank')) document.body.classList.add('typing');
});
$('view').addEventListener('focusout', (e) => {
  if (e.target.classList && e.target.classList.contains('blank')) document.body.classList.remove('typing');
});

// Any bar that appears anywhere — lesson, practice question, quick check,
// "Teach the AI" picture — gets its cut animated as soon as it lands.
const splitWatcher = new MutationObserver(() => {
  if (splitWatcher._queued) return;
  splitWatcher._queued = requestAnimationFrame(() => {
    splitWatcher._queued = 0;
    revealSplits($('view'));
  });
});
splitWatcher.observe($('view'), { childList: true, subtree: true });

$('versionBadge').textContent = APP_VERSION;
renderStarCount();
renderLearnHome();
revealSplits($('view'));
</script>
